<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Team Garra MMA — ¿Quién viene?</title>
<meta name="description" content="Apúntate a los entrenamientos de Team Garra MMA en Duke Gym, Costa Adeje." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0c;
    --surface: #17181a;
    --accent: #d81e2c;
    --text: #f2f1ed;
    --muted: #8c8b87;
    --line: #2a2b2d;
    --radius: 3px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Work Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding-bottom: 96px;
  }

  a { color: inherit; }

  ::selection { background: var(--accent); color: var(--text); }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  header {
    position: relative;
    padding: 56px 24px 40px;
    overflow: hidden;
    border-bottom: 1px solid var(--line);
  }

  .claw-marks {
    position: absolute;
    top: -20px;
    right: -40px;
    width: 220px;
    height: 220px;
    opacity: 0.9;
    pointer-events: none;
  }

  .eyebrow {
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0 0 6px;
  }

  h1 {
    font-family: "Anton", sans-serif;
    font-weight: 400;
    font-size: clamp(40px, 11vw, 72px);
    line-height: 0.92;
    margin: 0;
    letter-spacing: 0.01em;
    text-transform: uppercase;
  }

  h1 span {
    color: var(--accent);
  }

  .sub {
    margin: 16px 0 0;
    max-width: 460px;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.5;
  }

  .sub strong { color: var(--text); font-weight: 600; }

  main {
    flex: 1;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    padding: 8px 24px 24px;
  }

  .session {
    display: grid;
    grid-template-columns: 96px 1fr;
    gap: 20px;
    padding: 28px 0;
    border-bottom: 1px solid var(--line);
  }

  .session:last-child { border-bottom: none; }

  .session .when {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .session .day {
    font-family: "Anton", sans-serif;
    font-weight: 400;
    font-size: 20px;
    text-transform: uppercase;
  }

  .session .date {
    font-size: 13px;
    color: var(--muted);
  }

  .session .time {
    font-size: 13px;
    color: var(--muted);
    margin-top: 6px;
  }

  .session.today .day { color: var(--accent); }

  .attendees {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 28px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 5px 10px;
    font-size: 13px;
  }

  .chip button {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
  }

  .chip button:hover { color: var(--accent); }

  .empty-state {
    color: var(--muted);
    font-size: 13px;
    font-style: normal;
  }

  .go-btn {
    margin-top: 12px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
    font-family: "Work Sans", sans-serif;
    font-weight: 600;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .go-btn:hover {
    border-color: var(--accent);
    background: rgba(216, 30, 44, 0.08);
  }

  .go-btn.joined {
    border-color: var(--accent);
    background: rgba(216, 30, 44, 0.12);
  }

  .namebar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--surface);
    border-top: 1px solid var(--line);
    padding: 14px 20px calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: center;
  }

  .namebar-inner {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 640px;
  }

  .namebar input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: "Work Sans", sans-serif;
    font-size: 15px;
    padding: 11px 14px;
    border-radius: var(--radius);
  }

  .namebar input::placeholder { color: var(--muted); }

  .namebar .status {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    align-self: center;
  }

  .namebar .edit-link {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12px;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 24px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .session { animation: rise 420ms ease both; }
    .session:nth-child(1) { animation-delay: 0ms; }
    .session:nth-child(2) { animation-delay: 40ms; }
    .session:nth-child(3) { animation-delay: 80ms; }
    .session:nth-child(4) { animation-delay: 120ms; }
    .session:nth-child(5) { animation-delay: 160ms; }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    .session { grid-template-columns: 1fr; gap: 10px; }
  }
</style>
</head>
<body>

<header>
  <svg class="claw-marks" viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M190 10 L70 200" stroke="#d81e2c" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <path d="M165 0 L50 190" stroke="#d81e2c" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
    <path d="M140 -5 L35 175" stroke="#d81e2c" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
  </svg>
  <p class="eyebrow">Duke Gym · Costa Adeje</p>
  <h1>Team<br><span>Garra</span> MMA</h1>
  <p class="sub">Marca los entrenos a los que vas esta semana. <strong>Carlos</strong> ve la lista al momento — nada de grupos de WhatsApp perdidos.</p>
</header>

<main id="sessions">
  <!-- sessions injected here -->
</main>

<div class="namebar">
  <div class="namebar-inner" id="namebar-inner">
    <input id="name-input" type="text" placeholder="Tu nombre" autocomplete="name" maxlength="40" />
  </div>
</div>

<footer>Hecho para Team Garra MMA</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  "use strict";

  var SUPABASE_URL = "https://wstkqkqhtguvynugwivu.supabase.co";
  var SUPABASE_KEY = "sb_publishable_urm3EVAbdarocXd8sq-y6g_kjxP4_ir";
  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var SCHEDULE = [
    { weekday: 1, label: "Lunes", time: "18:00 – 19:30" },
    { weekday: 2, label: "Martes", time: "19:30 – 21:00" },
    { weekday: 3, label: "Miércoles", time: "18:00 – 19:30" },
    { weekday: 4, label: "Jueves", time: "19:30 – 21:00" },
    { weekday: 5, label: "Viernes", time: "18:00 – 19:30" }
  ];

  var DATE_FMT = new Intl.DateTimeFormat("es-ES", { day: "numeric", month: "short" });

  function toISODate(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function isSameDay(a, b) {
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }

  function nextSessions(count) {
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var out = [];
    var cursor = new Date(today);
    var guard = 0;
    while (out.length < count && guard < 60) {
      var match = SCHEDULE.find(function (s) { return s.weekday === cursor.getDay(); });
      if (match) {
        out.push({
          date: new Date(cursor),
          iso: toISODate(cursor),
          label: match.label,
          time: match.time,
          isToday: isSameDay(cursor, today)
        });
      }
      cursor.setDate(cursor.getDate() + 1);
      guard++;
    }
    return out;
  }

  var sessions = nextSessions(5);

  var mainEl = document.getElementById("sessions");
  var nameInput = document.getElementById("name-input");

  function getStoredName() {
    return (localStorage.getItem("garra_name") || "").trim();
  }
  function setStoredName(n) {
    localStorage.setItem("garra_name", n);
  }
  nameInput.value = getStoredName();
  nameInput.addEventListener("input", function () {
    setStoredName(nameInput.value.trim());
  });

  var rsvpsBySession = {};

  function render() {
    mainEl.innerHTML = "";
    var myName = getStoredName();

    sessions.forEach(function (s) {
      var wrap = document.createElement("div");
      wrap.className = "session" + (s.isToday ? " today" : "");

      var when = document.createElement("div");
      when.className = "when";
      when.innerHTML =
        '<div class="day">' + s.label + (s.isToday ? " · hoy" : "") + '</div>' +
        '<div class="date">' + DATE_FMT.format(s.date) + '</div>' +
        '<div class="time">' + s.time + '</div>';
      wrap.appendChild(when);

      var right = document.createElement("div");

      var attendees = document.createElement("div");
      attendees.className = "attendees";
      var names = rsvpsBySession[s.iso] || [];

      if (names.length === 0) {
        var empty = document.createElement("span");
        empty.className = "empty-state";
        empty.textContent = "Todavía nadie apuntado";
        attendees.appendChild(empty);
      } else {
        names.forEach(function (n) {
          var chip = document.createElement("span");
          chip.className = "chip";
          var isMe = myName && n.toLowerCase() === myName.toLowerCase();
          chip.innerHTML = '<span>' + escapeHtml(n) + '</span>';
          if (isMe) {
            var rm = document.createElement("button");
            rm.textContent = "✕";
            rm.setAttribute("aria-label", "Quitarme de " + s.label);
            rm.addEventListener("click", function () { leaveSession(s.iso); });
            chip.appendChild(rm);
          }
          attendees.appendChild(chip);
        });
      }
      right.appendChild(attendees);

      var joined = myName && names.some(function (n) { return n.toLowerCase() === myName.toLowerCase(); });
      var btn = document.createElement("button");
      btn.className = "go-btn" + (joined ? " joined" : "");
      btn.textContent = joined ? "✓ Voy" : "Voy a este";
      btn.addEventListener("click", function () {
        if (joined) { leaveSession(s.iso); } else { joinSession(s.iso); }
      });
      right.appendChild(btn);

      wrap.appendChild(right);
      mainEl.appendChild(wrap);
    });
  }

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function joinSession(iso) {
    var name = getStoredName();
    if (!name) {
      nameInput.focus();
      nameInput.placeholder = "Escribe tu nombre primero";
      return;
    }
    sb.from("rsvps").insert({ session_date: iso, name: name }).then(function (res) {
      if (res.error && res.error.code !== "23505") {
        console.error(res.error);
        return;
      }
      loadData();
    });
  }

  function leaveSession(iso) {
    var name = getStoredName();
    if (!name) return;
    sb.from("rsvps").delete().eq("session_date", iso).ilike("name", name).then(function (res) {
      if (res.error) { console.error(res.error); return; }
      loadData();
    });
  }

  function loadData() {
    var isoList = sessions.map(function (s) { return s.iso; });
    sb.from("rsvps").select("session_date,name").in("session_date", isoList).order("created_at", { ascending: true })
      .then(function (res) {
        if (res.error) { console.error(res.error); render(); return; }
        rsvpsBySession = {};
        (res.data || []).forEach(function (row) {
          if (!rsvpsBySession[row.session_date]) rsvpsBySession[row.session_date] = [];
          rsvpsBySession[row.session_date].push(row.name);
        });
        render();
      });
  }

  render();
  loadData();

  sb.channel("rsvps-changes")
    .on("postgres_changes", { event: "*", schema: "public", table: "rsvps" }, function () { loadData(); })
    .subscribe();
})();
</script>

</body>
</html>
